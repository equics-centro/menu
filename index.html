<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equics Centro Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: single phone-first column; header band, sticky category chips, menu sections with dotted price leaders */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f8f7; --surface:#ffffff; --ink:#14211f; --muted:#5d6b68; --line:#dbe3e1;
  --accent:#0d6b61; --accent-ink:#ffffff; --sun:#e8873a; --band:#0f2e2a; --band-ink:#eaf3f1;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#152220; --ink:#e6eeec; --muted:#9aaba7; --line:#26403c;
  --accent:#4fc2b2; --accent-ink:#06201c; --sun:#f0a35f; --band:#0a1312; --band-ink:#e6eeec; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#152220; --ink:#e6eeec; --muted:#9aaba7; --line:#26403c;
  --accent:#4fc2b2; --accent-ink:#06201c; --sun:#f0a35f; --band:#0a1312; --band-ink:#e6eeec; color-scheme:dark }

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--band);color:var(--band-ink)}
header .wrap{padding-block:36px 28px;display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,10vw,52px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.addr{color:color-mix(in srgb,var(--band-ink) 78%,transparent);font-size:14px;margin:4px 0 0;max-width:40ch}
.addr a{color:inherit;text-decoration-color:var(--sun);text-underline-offset:3px}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main .wrap{padding-block:8px 48px;display:grid;gap:36px}
section{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:24px 0 4px;letter-spacing:-.01em}
.sec-note{color:var(--muted);font-size:14px;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0}
li{padding:14px 0;border-bottom:1px dashed var(--line);display:grid;gap:4px}
li:last-child{border-bottom:0}
.row{display:flex;align-items:baseline;gap:10px}
.name{font-weight:600;font-size:17px;min-width:0}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;color:var(--accent)}
.price small{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-right:3px;font-weight:600}
.desc{color:var(--muted);font-size:14px;margin:0;max-width:52ch}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sun);margin-left:6px;vertical-align:2px}

.sample{background:color-mix(in srgb,var(--sun) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--sun) 45%,transparent);border-radius:10px;padding:12px 14px;font-size:14px;margin-top:20px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:20px 32px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.item-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.item-foot:empty{display:none}
li.soldout .name,li.soldout .price{opacity:.5}
.so{flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
</style>
</head>
<body>


<header>
  <div class="wrap">
    <span class="eyebrow">Menu · Malé</span>
    <h1>Equics Centro</h1>
    <p class="addr"><a href="https://www.google.com/maps/search/?api=1&query=Nasandhura+Building+Meheli+Goalhi+Male+Maldives">Barcelo, Nasandhura Building, Ground Floor, Meheli Goalhi, 20014</a></p>
  </div>
</header>

<nav aria-label="Menu categories"><div class="wrap" id="chips"></div></nav>

<main><div class="wrap">
  <div class="sample" id="sample-note">Sample items shown. Real products and prices coming soon.</div>
  <div id="menu"></div>
</div></main>

<footer><div class="wrap">Prices in Maldivian Rufiyaa (MVR). Please ask our staff about allergens.</div></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const $ = id => document.getElementById(id);

let sectionObserver = null;

/* ---------- menu rendering (runs again whenever the menu changes) ---------- */
function showMenu(data){
  const MENU = (data.menu || []).filter(c => c.items && c.items.length);
  $("sample-note").hidden = !data.showSampleNote;

  const active = document.querySelector(".chip.on")?.dataset.id;
  $("chips").innerHTML = MENU.map((c,i) =>
    `<a class="chip${(active ? slug(c.category)===active : !i) ? " on" : ""}" href="#${slug(c.category)}" data-id="${slug(c.category)}">${esc(c.category)}</a>`).join("");
  $("menu").innerHTML = MENU.map(c => `
  <section id="${slug(c.category)}">
    <h2>${esc(c.category)}</h2>
    <ul>${c.items.map(it => `
      <li class="${it.available === false ? "soldout" : ""}">
        <div class="row"><span class="name">${esc(it.name)}${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}</span><span class="dots" aria-hidden="true"></span><span class="price"><small>MVR</small>${fmt(it.price)}</span></div>
        ${it.desc || it.available === false ? `<div class="item-foot">${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : "<span></span>"}${it.available === false ? `<span class="so">Sold out</span>` : ""}</div>` : ""}
      </li>`).join("")}
    </ul>
  </section>`).join("");

  document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", e => {
    e.preventDefault(); document.getElementById(ch.dataset.id).scrollIntoView(); setOn(ch.dataset.id);
  }));
  if ("IntersectionObserver" in window){
    sectionObserver?.disconnect();
    sectionObserver = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setOn(e.target.id); }), {rootMargin:"-30% 0px -60% 0px"});
    document.querySelectorAll("section").forEach(s => sectionObserver.observe(s));
  }
}
function setOn(id){
  document.querySelectorAll(".chip").forEach(ch => {
    const on = ch.dataset.id === id; ch.classList.toggle("on", on);
    if (on) ch.parentElement.scrollTo({left: ch.offsetLeft - 16, behavior: "smooth"});
  });
}
function menuError(){
  $("menu").innerHTML = '<p class="sec-note" style="margin-top:24px">Menu could not load. Please refresh the page.</p>';
}

/* ---------- load: live from Firebase, or menu.json as backup ---------- */
function loadBackup(){ fetch("menu.json", {cache:"no-store"}).then(r => r.json()).then(showMenu).catch(menuError); }
const cfg = window.FIREBASE_CONFIG;
if (window.firebase && cfg && cfg.apiKey){
  try {
    firebase.initializeApp(cfg);
    let gotLive = false;
    firebase.firestore().doc("menu/main").onSnapshot(snap => {
      if (snap.exists && (snap.data().menu || []).length){ gotLive = true; showMenu(snap.data()); }
      else if (!gotLive) loadBackup();
    }, () => { if (!gotLive) loadBackup(); });
  } catch (e) { loadBackup(); }
} else {
  loadBackup();
}
</script>
</body>
</html>
