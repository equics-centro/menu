<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6eddc">
<title>Equics Centro Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: paper-cream single column. Hero = logo + stacked FOOD/MENU beside an arched cover photo,
   sticky category chips, then one section per category with photo cards and price pills. */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:light;
  --paper:#f6eddc; --card:#fffaf1; --ink:#1b2a45; --muted:#6d6658; --line:#e7d9bf;
  --teal:#0e5f5a; --coral:#e2553b; --sun:#e8a33a; --leaf:#2f8a55; --sea:#2aa6b5;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Caveat","Segoe Script","Comic Sans MS",cursive;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--body);
  background:
    radial-gradient(1200px 600px at 110% -10%, rgba(232,163,58,.14), transparent 60%),
    radial-gradient(900px 500px at -20% 30%, rgba(14,95,90,.07), transparent 60%),
    var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:14px;align-items:center;padding-block:22px 28px}
.mandala{position:absolute;width:340px;height:340px;right:-150px;top:-120px;opacity:.28;pointer-events:none}
.mandala.b{right:auto;top:auto;left:-170px;bottom:-190px;opacity:.22}
.logo{display:block;width:150px;height:auto;margin-bottom:14px}
.logo-text{display:none;font:800 22px var(--body);letter-spacing:.02em;color:var(--ink);margin-bottom:14px}
.logo-text b{color:var(--leaf)}
.title{font-family:var(--display);font-weight:400;line-height:.88;margin:0;letter-spacing:.01em;text-transform:uppercase}
.title span{display:block;font-size:clamp(58px,17vw,104px)}
.title .t1{color:var(--teal)}
.title .t2{color:var(--coral)}
.rule{display:flex;align-items:center;gap:8px;margin:14px 0 8px;color:var(--teal);max-width:220px}
.rule::before,.rule::after{content:"";height:1.5px;background:currentColor;flex:1;opacity:.6}
.rule svg{width:12px;height:12px;flex:none}
.tagline{font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0}
.love{font-family:var(--script);font-size:24px;color:var(--ink);margin:6px 0 0;line-height:1.1}
.arch{position:relative;justify-self:end;width:100%;max-width:300px;aspect-ratio:327/345;border-radius:999px 999px 26px 26px;overflow:hidden;
  background:linear-gradient(160deg,#cfe6c9,#e9d5a8);box-shadow:0 18px 40px -18px rgba(27,42,69,.45);border:5px solid var(--card)}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.arch::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,rgba(14,95,90,.25))}
.addr{position:relative;display:flex;gap:8px;align-items:flex-start;margin:0 auto;padding-block:0 18px;font-size:14px;color:var(--muted)}
.addr svg{flex:none;width:16px;height:16px;margin-top:3px;color:var(--coral)}
.addr a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--muted)}

/* ---------- category chips ---------- */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 14px var(--body);padding:8px 15px;border-radius:999px;text-decoration:none;white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* ---------- sections ---------- */
main .wrap{padding-block:10px 40px;display:grid;gap:34px}
section{scroll-margin-top:calc(66px + env(safe-area-inset-top,0px))}
.sec-head{display:grid;gap:2px;margin:18px 0 14px}
.sec-head .kicker{display:flex;align-items:center;gap:10px;color:var(--c,var(--teal));font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.sec-head .kicker::after{content:"";height:2px;flex:1;background:repeating-linear-gradient(90deg,currentColor 0 10px,transparent 10px 16px);opacity:.55}
.sec-head h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
.sec-head h2 em{font-style:normal;color:var(--c,var(--teal))}
.sec-head .note{font-family:var(--script);font-size:22px;color:var(--muted);margin:2px 0 0;line-height:1.1}
.group{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--ink);justify-self:start;padding:5px 14px 5px 12px;border-radius:4px 14px 14px 4px;margin:14px 0 2px;transform:rotate(-1.5deg)}
.items{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.items{grid-template-columns:1fr 1fr}}

.card{position:relative;display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px 10px 10px;box-shadow:0 1px 0 rgba(27,42,69,.04)}
.ph{width:92px;height:92px;border-radius:16px;background-color:color-mix(in srgb,var(--c,var(--teal)) 12%,var(--card));background-repeat:no-repeat;display:grid;place-items:center;overflow:hidden}
.ph span{font-family:var(--display);font-size:34px;color:var(--c,var(--teal));opacity:.55}
body.photos .ph[data-i] span{display:none}
.info{min-width:0;display:grid;gap:4px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.name{font-weight:700;font-size:16.5px;line-height:1.25;margin:0;text-wrap:balance}
.desc{color:var(--muted);font-size:13.5px;line-height:1.4;margin:0}
.price{flex:none;display:inline-flex;align-items:baseline;gap:3px;background:var(--c,var(--teal));color:#fff;border-radius:999px;padding:3px 11px 4px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.3}
.price small{font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.85}
.price.ask{background:transparent;color:var(--muted);border:1.5px dashed var(--line);font-size:12px;font-weight:700;padding:3px 10px}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.size{display:inline-flex;align-items:baseline;gap:5px;border:1.5px solid var(--c,var(--teal));border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.size i{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.size b{color:var(--c,var(--teal))}
.card.off .ph{filter:grayscale(1);opacity:.55}
.card.off .name,.card.off .desc{opacity:.6}
.off-tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);border:1.5px solid currentColor;border-radius:999px;padding:2px 9px;white-space:nowrap}
.loading{color:var(--muted);text-align:center;padding:40px 0}

/* ---------- footer ---------- */
footer{position:relative;margin-top:20px;color:#e9f4f2;background:var(--teal)}
footer .wave{position:absolute;left:0;right:0;top:-38px;height:40px;width:100%;display:block}
footer .wrap{padding-block:26px 34px;display:grid;gap:6px;text-align:center}
footer .script{font-family:var(--script);font-size:28px;color:#fff;margin:0;line-height:1}
footer p{margin:0;font-size:13.5px;opacity:.9}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>

<header class="hero">
  <canvas class="mandala" id="mandala" width="600" height="600" aria-hidden="true"></canvas>
  <canvas class="mandala b" id="mandala2" width="600" height="600" aria-hidden="true"></canvas>
  <div class="wrap hero-grid">
    <div>
      <img class="logo" id="logo" src="menu-logo.png" alt="Equics" width="241" height="62">
      <div class="logo-text" id="logoText"><b>≡</b> EQUICS</div>
      <h1 class="title"><span class="t1">Food</span><span class="t2">Menu</span></h1>
      <div class="rule"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M6 0l1.4 4.6L12 6 7.4 7.4 6 12 4.6 7.4 0 6l4.6-1.4z"/></svg></div>
      <p class="tagline">Local flavours. Warm moments.</p>
      <p class="love">Brought to you with love</p>
    </div>
    <div class="arch"><img id="cover" src="menu-cover.webp" alt="Tea, coffee and Maldivian short eats on a table" width="327" height="345"></div>
  </div>
  <p class="addr wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
    <a href="https://www.google.com/maps/search/?api=1&query=Nasandhura+Building+Meheli+Goalhi+Male+Maldives">Equics Centro · Barcelo, Nasandhura Building, Ground Floor, Meheli Goalhi, 20014</a></p>
</header>

<nav aria-label="Menu categories"><div class="wrap" id="chips"></div></nav>

<main><div class="wrap" id="menu"><p class="loading">Loading menu…</p></div></main>

<footer>
  <svg class="wave" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true"><path fill="#0e5f5a" d="M0 22c120-18 240-18 360 0s240 18 360 0 240-18 360 0 240 18 360 0v18H0z"/><path fill="#2aa6b5" opacity=".35" d="M0 30c120-12 240-12 360 0s240 12 360 0 240-12 360 0 240 12 360 0v10H0z"/></svg>
  <div class="wrap">
    <p class="script">See you again soon</p>
    <p>Prices are in Maldivian Rufiyaa (MVR). Ask our staff about allergens.</p>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* Photo sheet: menu-photos.webp is an 8 x 7 grid, one photo per name below (in order). */
const PHOTO = {cols:8, rows:7, names:["Lavazza Black Coffee","Lavazza Milk Coffee","Lavazza Espresso","Lavazza Cappuccino","Lavazza Hot Choco","Lavazza Latte","Lavazza Mochaccino","Hot Cardamom Tea","Hot Bombay Tea","Hot Lemon Tea","Hot Coffee Milk Tea","Blueberry Slushie","Pink Guava Slushie","Mango Slushie","Mandarin Slushie","Mix Slushie","Tropical Fruit Juice","Mixed Fruit Juice","Burger","Mini Burger","Slice Chicken Sandwich","Panino Sandwich","Hotdog Sandwich","Toast Sandwich","Egg Puff","Chicken Puff","Tuna Puff","Tuna Puff Small","Veg Puff","Bechamel Chicken Roll","Chicken Spring Roll","Sausage Stick","Sausage Bun","Bajiya","Gulha","Kabaab","Laddu","Banana Cake","Japanese Cheese Cake","Dilkush","Doughnut Small","Almond Croissant","Sweet Naan","Butter Cake","Mini Muffin","Banana Cake with Chocolate","Brownie","Chocolate Chip Cookies","Choco Nutella Cookies","Pistachio Cookies","Snickers Cookies","Red Velvet Cookie","Nutella Cookies","Almond Cookies","Soft-Served Ice Cream Cone","Soft-Served Ice Cream Cup"]};
const photoIndex = {}; PHOTO.names.forEach((n,i) => photoIndex[n.toLowerCase()] = i);
const ACCENTS = ["#0e5f5a","#e2553b","#2f8a55","#c9821f","#2a8fa0"];

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
const $ = id => document.getElementById(id);
const hasPrice = v => v !== null && v !== undefined && v !== "" && !isNaN(Number(v));

/* photos: only switch to photo mode once the sheet has actually loaded */
const sheet = new Image();
sheet.onload = () => document.body.classList.add("photos");
sheet.src = "menu-photos.webp";
$("logo").onerror = () => { $("logo").hidden = true; $("logoText").style.display = "block"; };
$("cover").onerror = () => { $("cover").hidden = true; };

function phStyle(name){
  const i = photoIndex[String(name).toLowerCase()];
  if (i === undefined) return "";
  const c = i % PHOTO.cols, r = Math.floor(i / PHOTO.cols);
  return ` data-i="${i}" style="background-image:url(menu-photos.webp);background-size:${PHOTO.cols*100}% ${PHOTO.rows*100}%;background-position:${c*100/(PHOTO.cols-1)}% ${r*100/(PHOTO.rows-1)}%"`;
}
function priceHTML(it){
  if (it.available === false) return `<span class="off-tag">Not available</span>`;
  if (Array.isArray(it.sizes) && it.sizes.length) return "";
  return hasPrice(it.price) ? `<span class="price"><small>MVR</small>${fmt(it.price)}</span>` : `<span class="price ask">Ask staff</span>`;
}
function sizesHTML(it){
  if (it.available === false || !Array.isArray(it.sizes) || !it.sizes.length) return "";
  return `<div class="sizes">${it.sizes.map(s => `<span class="size"><i>${esc(s.label)}</i><b>${hasPrice(s.price) ? "MVR " + fmt(s.price) : "Ask"}</b></span>`).join("")}</div>`;
}
function titleHTML(cat){            // colour the last word: "Hot <em>Beverages</em>"
  const w = esc(cat).split(" ");
  return w.length > 1 ? w.slice(0,-1).join(" ") + " <em>" + w[w.length-1] + "</em>" : "<em>" + w[0] + "</em>";
}

let observer = null;
function showMenu(data){
  const MENU = (data.menu || []).filter(c => c.items && c.items.length);
  const active = document.querySelector(".chip.on")?.dataset.id;
  $("chips").innerHTML = MENU.map((c,i) =>
    `<a class="chip${(active ? slug(c.category)===active : !i) ? " on" : ""}" href="#${slug(c.category)}" data-id="${slug(c.category)}">${esc(c.category)}</a>`).join("");
  $("menu").innerHTML = MENU.map((c,ci) => {
    let lastGroup = null;
    const cards = c.items.map(it => {
      let g = "";
      if (it.group && it.group !== lastGroup){ g = `</div><div class="group">${esc(it.group)}</div><div class="items">`; lastGroup = it.group; }
      return g + `<article class="card${it.available === false ? " off" : ""}">
        <div class="ph"${phStyle(it.name)}><span>${esc(String(it.name).trim().charAt(0))}</span></div>
        <div class="info">
          <div class="top"><h3 class="name">${esc(it.name)}</h3>${priceHTML(it)}</div>
          ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
          ${sizesHTML(it)}
        </div>
      </article>`;
    }).join("");
    return `<section id="${slug(c.category)}" style="--c:${ACCENTS[ci % ACCENTS.length]}">
      <div class="sec-head">
        <span class="kicker">${String(ci+1).padStart(2,"0")} · ${c.items.length} item${c.items.length===1?"":"s"}</span>
        <h2>${titleHTML(c.category)}</h2>
        ${c.note ? `<p class="note">${esc(c.note)}</p>` : ""}
      </div>
      <div class="items">${cards}</div>
    </section>`;
  }).join("").replace(/<div class="items"><\/div>/g,"");

  document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", e => {
    e.preventDefault(); document.getElementById(ch.dataset.id).scrollIntoView(); setOn(ch.dataset.id);
  }));
  if ("IntersectionObserver" in window){
    observer?.disconnect();
    observer = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setOn(e.target.id); }), {rootMargin:"-30% 0px -60% 0px"});
    document.querySelectorAll("section").forEach(s => observer.observe(s));
  }
}
function setOn(id){
  document.querySelectorAll(".chip").forEach(ch => {
    const on = ch.dataset.id === id; ch.classList.toggle("on", on);
    if (on) ch.parentElement.scrollTo({left: ch.offsetLeft - 16, behavior: "smooth"});
  });
}

/* ---------- mandala ornament (drawn, not an image) ---------- */
["mandala","mandala2"].forEach(function(id){
  const cv = $(id), x = cv.getContext("2d"), R = 300;
  x.translate(R,R);
  const ring = (r, n, draw) => { for (let i=0;i<n;i++){ x.save(); x.rotate(i*2*Math.PI/n); draw(r); x.restore(); } };
  const col = ["#0e5f5a","#e2553b","#e8a33a","#2aa6b5","#2f8a55"];
  x.lineWidth = 3;
  ring(270, 36, r => { x.fillStyle = col[0]; x.beginPath(); x.moveTo(0,-r); x.lineTo(14,-r+34); x.lineTo(-14,-r+34); x.closePath(); x.fill(); });
  ring(225, 24, r => { x.fillStyle = col[1]; x.beginPath(); x.ellipse(0,-r,11,26,0,0,7); x.fill(); });
  ring(180, 18, r => { x.strokeStyle = col[2]; x.beginPath(); x.arc(0,-r,18,0,7); x.stroke(); x.fillStyle = col[2]; x.beginPath(); x.arc(0,-r,6,0,7); x.fill(); });
  ring(135, 12, r => { x.fillStyle = col[3]; x.beginPath(); x.moveTo(0,-r-30); x.quadraticCurveTo(24,-r,0,-r+30); x.quadraticCurveTo(-24,-r,0,-r-30); x.fill(); });
  ring(80, 8, r => { x.fillStyle = col[4]; x.beginPath(); x.ellipse(0,-r,12,30,0,0,7); x.fill(); });
  [262,212,160,105].forEach((r,i) => { x.strokeStyle = col[i % col.length]; x.globalAlpha = .5; x.beginPath(); x.arc(0,0,r,0,7); x.stroke(); });
  x.globalAlpha = 1; x.fillStyle = col[1]; x.beginPath(); x.arc(0,0,26,0,7); x.fill();
});

/* ---------- load: live from Firebase, or menu.json as backup ---------- */
function menuError(){ $("menu").innerHTML = '<p class="loading">Menu could not load. Please refresh the page.</p>'; }
function loadBackup(){ fetch("menu.json", {cache:"no-store"}).then(r => r.json()).then(showMenu).catch(menuError); }
const cfg = window.FIREBASE_CONFIG;
if (window.firebase && cfg && cfg.apiKey){
  try {
    firebase.initializeApp(cfg);
    let gotLive = false;
    firebase.firestore().doc("menu/main").onSnapshot(snap => {
      if (snap.exists && (snap.data().menu || []).length){ gotLive = true; showMenu(snap.data()); }
      else if (!gotLive) loadBackup();
    }, () => { if (!gotLive) loadBackup(); });
  } catch (e) { loadBackup(); }
} else {
  loadBackup();
}
</script>
</body>
</html>
